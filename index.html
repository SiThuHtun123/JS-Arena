<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Arena</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOBBY -->
  <div id="lobbyScreen">
    <div class="container">

      <!-- Name + mode -->
      <div id="mainSection">
        <h1>JS ARENA</h1>
        <p class="subtitle">⚔ BATTLE ROYALE ⚔</p>
        <input type="text" id="nameInput" placeholder="Enter your username" maxlength="20" />
        <div class="error" id="mainError"></div>
        <button class="btn btn-primary" onclick="createRoom()">⚔ CREATE ROOM</button>
        <div class="divider">— or join existing —</div>
        <input type="text" id="codeInput" placeholder="Room code (e.g. AAA)"
               maxlength="3" style="text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:1.2em;" />
        <button class="btn btn-secondary" onclick="joinRoom()">▶ JOIN ROOM</button>
      </div>

      <!-- Waiting room -->
      <div id="waitingRoom">
        <h1>JS ARENA</h1>
        <p class="subtitle">⚔ WAITING FOR SOLDIERS ⚔</p>
        <p style="color:#5a4020;font-size:0.82em;letter-spacing:2px;">SHARE THIS CODE:</p>
        <div class="room-code" id="roomCodeDisplay">---</div>
        <div class="player-list" id="playerList"></div>
        <div class="waiting-text" id="waitingText">Waiting for host to start...</div>
        <button class="btn btn-primary" id="startBtn" onclick="startGame()">⚔ START BATTLE</button>
        <div class="error" id="lobbyError"></div>
      </div>

    </div>
  </div>

  <!-- GAME -->
  <div id="gameScreen">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="map.js"></script>
  <script src="player.js"></script>
  <script src="combat.js"></script>
  <script src="sounds.js"></script>

  <script>
    // ---- LOBBY LOGIC ----
    const socket  = io();
    let myRoomCode = '';
    let amHost     = false;

    socket.on('connect', () => {});

    function getName() {
      const n = document.getElementById('nameInput').value.trim();
      if (!n) { document.getElementById('mainError').textContent = 'Enter a username.'; return null; }
      document.getElementById('mainError').textContent = '';
      return n;
    }

    function createRoom() {
      const name = getName(); if (!name) return;
      socket.emit('create_room', { name }, (res) => {
        if (res.error) { document.getElementById('mainError').textContent = res.error; return; }
        myRoomCode = res.code;
        amHost     = true;
        showWaiting(res.players);
        document.getElementById('startBtn').style.display    = 'block';
        document.getElementById('waitingText').textContent   = 'You are the host. Start when ready!';
      });
    }

    function joinRoom() {
      const name = getName(); if (!name) return;
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      if (!code) { document.getElementById('mainError').textContent = 'Enter a room code.'; return; }
      socket.emit('join_room', { name, code }, (res) => {
        if (res.error) { document.getElementById('mainError').textContent = res.error; return; }
        myRoomCode = res.code;
        amHost     = socket.id === res.host;
        showWaiting(res.players);
        if (amHost) {
          document.getElementById('startBtn').style.display  = 'block';
          document.getElementById('waitingText').textContent = 'You are the host. Start when ready!';
        }
      });
    }

    function showWaiting(players) {
      document.getElementById('mainSection').style.display  = 'none';
      document.getElementById('waitingRoom').style.display  = 'block';
      document.getElementById('roomCodeDisplay').textContent = myRoomCode;
      renderPlayers(players);
    }

    function renderPlayers(players) {
      const list = document.getElementById('playerList');
      list.innerHTML = '';
      Object.values(players).forEach(p => {
        const div = document.createElement('div');
        div.className = 'player-entry';
        div.innerHTML = `👤 ${p.name} ${p.id === socket.id ? '<span class="you-tag">YOU</span>' : ''}`;
        list.appendChild(div);
      });
    }

    function startGame() { socket.emit('start_game'); }

    socket.on('player_joined', ({ players }) => { renderPlayers(players); });

    socket.on('host_changed', ({ newHost }) => {
      if (newHost === socket.id) {
        amHost = true;
        document.getElementById('startBtn').style.display  = 'block';
        document.getElementById('waitingText').textContent = 'Host left. You are now the host!';
      }
    });

    socket.on('player_left', () => {});

    // ---- LOADING PHASE — switch to game screen and start loading assets ----
    socket.on('load_assets', ({ players }) => {
      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display  = 'flex';
      startLoad_init(players, socket.id);
    });

    // ---- ALL PLAYERS READY — start the actual game ----
    socket.on('game_started', ({ players, startTime }) => {
      startGame_init(players, startTime);
    });

    // ---- Show ready count in lobby while waiting ----
    socket.on('player_ready_update', ({ readyCount, totalCount }) => {
      document.getElementById('waitingText').textContent =
        `Loading... ${readyCount}/${totalCount} players ready`;
    });
  </script>

  <script src="game.js"></script>
</body>
</html>
